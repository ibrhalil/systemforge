name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Aynı branch için eski run'ları iptal et (yeni push gelince)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changes (path detection)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Merge-base (BASE...HEAD) hesabı için tam geçmiş gerekir.
          fetch-depth: 0

      # Saf git-diff path detection (üçüncü parti action yok).
      # - pull_request -> hedef branch ucu (origin/<base_ref>) ile üç-nokta diff
      # - push -> event.before ile diff
      # - base çözülemezse (yeni branch / force push / zero SHA) fail-safe:
      #   tüm dosyalar değişmiş sayılır -> hiçbir job skip edilmez.
      # Ortak dosyalar (pom.xml, mvnw, ci.yml) ilgili tüm filtreleri tetikler;
      # docs/**, README.md, infra/** hiçbir job'u tetiklemez.
      - name: Detect changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          ZERO_SHA="0000000000000000000000000000000000000000"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Hedef branch ucunun yerelde olduğundan emin ol (idempotent).
            git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            BASE="refs/remotes/origin/${BASE_REF}"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "$ZERO_SHA" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BASE="$BEFORE"
          else
            BASE=""
          fi

          if [ -n "$BASE" ]; then
            FILES="$(git diff --name-only "${BASE}...HEAD")"
          else
            FILES="$(git ls-tree -r --name-only HEAD)"
          fi

          BACKEND_RE='^(backend|common|persistence)/|^pom\.xml$|^mvnw(\.cmd)?$|^\.github/workflows/ci\.yml$'
          FRONTEND_RE='^frontend/|^\.npmrc$|^\.nvmrc$|^\.github/workflows/ci\.yml$'
          DOCKER_RE='^Dockerfile$|^\.dockerignore$|^docker-compose[^/]*\.yml$|^\.github/workflows/ci\.yml$'

          filter() { printf '%s\n' "$FILES" | grep -Eq "$1" && echo true || echo false; }

          BACKEND_CHANGED="$(filter "$BACKEND_RE")"
          FRONTEND_CHANGED="$(filter "$FRONTEND_RE")"
          # İmaj backend+frontend'i birlikte paketler -> ikisinden biri veya
          # Docker dosyaları değişince yeniden build gerekir.
          if [ "$BACKEND_CHANGED" = true ] || [ "$FRONTEND_CHANGED" = true ] || [ "$(filter "$DOCKER_RE")" = true ]; then
            DOCKER_CHANGED=true
          else
            DOCKER_CHANGED=false
          fi
          # E2E (K-57) tek jar'da ikisini de paketler -> backend VEYA frontend
          # değişince koşar (FRONTEND_RE zaten frontend/e2e/** kapsar).
          if [ "$BACKEND_CHANGED" = true ] || [ "$FRONTEND_CHANGED" = true ]; then
            E2E_CHANGED=true
          else
            E2E_CHANGED=false
          fi

          {
            echo "backend=$BACKEND_CHANGED"
            echo "frontend=$FRONTEND_CHANGED"
            echo "docker=$DOCKER_CHANGED"
            echo "e2e=$E2E_CHANGED"
          } >> "$GITHUB_OUTPUT"

  backend:
    name: Backend (Maven + H2 tests)
    needs: changes
    # Path gate: yalnız backend/common/persistence + kök pom/mvnw/ci.yml değişince koşar.
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Test profili H2 (MODE=PostgreSQL) kullanır -> PostgreSQL/Redis gerekmez.
      # Sadece backend + upstream (common, persistence) build edilir. frontend
      # modülü atlanır çünkü paralel "frontend" job'ında lint+test+build koşar;
      # böylece npm install/build iki kez çalışmaz. backend testleri static
      # resource'lara bağımlı değil (AuditingTest, ForgeSysApplicationTests).
      - name: Build & Test
        run: ./mvnw --no-transfer-progress clean install -pl backend -am

  integration:
    name: Integration (Testcontainers — real PG + Redis)
    needs: changes
    # Path gate: backend job ile aynı tetikleyiciler (tenant izolasyonu kritik,
    # her backend değişikliğinde koşar).
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Gerçek PG (tenant izolasyonu + modül aktivasyonu + JSONB search) ve
      # gerçek Redis (refresh rotation/reuse state machine) doğrulaması.
      # Gate'ler (-Dforgesys.pg.it / -Dforgesys.redis.it) bu job'da açık;
      # H2 suite'i "backend" job'ında zaten koştuğu için yalnız 4 IT sınıfı
      # seçilir (README'deki yerleşik komut pattern'i ile aynı).
      - name: Gated ITs (real PG + Redis)
        run: >-
          ./mvnw --no-transfer-progress -pl backend -am test
          -Dtest=CrossTenantIsolationTest,ModuleActivationIT,AppBuilderIT,RedisRefreshTokenIT
          -Dforgesys.pg.it=true
          -Dforgesys.redis.it=true
          -Dsurefire.failIfNoSpecifiedTests=false

  frontend:
    name: Frontend (lint + test + build)
    needs: changes
    # Path gate: yalnız frontend + .npmrc/.nvmrc/ci.yml değişince koşar.
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Lock file yok (proje politikası: .npmrc package-lock=false) ->
      # setup-node cache: npm kullanılamaz; ~/.npm tarball cache'i manuel
      # tutulur (key: package.json hash — save-exact pin'ler değişince miss).
      - name: Cache npm (~/.npm)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Lock file yok (proje politikası: .npmrc package-lock=false).
      # --include=optional: native paketler (esbuild/rollup) linux için kurulur.
      - name: Install dependencies
        run: npm install --include=optional

      - name: Lint (oxlint)
        run: npm run lint

      # Vitest + RTL (jsdom) — K-39 frontend kalite gate'i.
      - name: Test (vitest)
        run: npm test

      - name: Build (tsc -b && vite build)
        run: npm run build

  # K-57: prod-like jar topolojisinde (backend + gömülü SPA, :8080) kritik
  # kullanıcı yollarının E2E doğrulaması — required PR gate'i. Backend VEYA
  # frontend değişince koşar; docker job'unun needs'i DEĞİŞMEDİ (kardeş gate).
  e2e:
    name: E2E (Playwright — prod-like jar)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Lock file yok — frontend job'ı ile aynı ~/.npm tarball cache pattern'i.
      - name: Cache npm (~/.npm)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --include=optional

      # npm install tarayıcı indirmez (browsers.json sadece kayıt tutar).
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start infra (db + redis + mailpit)
        run: docker compose up -d db redis mailpit

      - name: Wait for infra health
        run: |
          for i in $(seq 1 30); do
            HEALTHY=$(docker compose ps --format '{{.Health}}' db redis mailpit | grep -c '^healthy$' || true)
            if [ "$HEALTHY" -ge 3 ]; then echo "infra healthy"; exit 0; fi
            sleep 2
          done
          docker compose ps
          exit 1

      # FULL reactor build — jar'a SPA gömmek için frontend modülü de gerekir
      # (-pl backend -am frontend'i atlar, CI backend job'undaki kasıtlı kısayol).
      - name: Build jar (full reactor)
        run: ./mvnw --no-transfer-progress clean package -DskipTests

      # CI=true: webServer reuse yok, retry 1, trace on-first-retry.
      - name: Run E2E
        working-directory: frontend
        run: npm run e2e

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  docker:
    name: Docker (build + GHCR publish)
    needs: [changes, backend, frontend, integration]
    # CD: yalnız develop/main push'unda imaj basılır (PR'da koşmaz).
    # docs-only push'ta "docker" output false gelir -> imaj basılmaz.
    # !cancelled(): upstream job'lardan biri path filtresiyle skip edildiğinde
    # bu job'ın otomatik skip olmasını engeller; failure/cancelled guard'ları
    # mevcut "hepsi başarılıysa" semantiğini korur (skip == başarılı sayılır).
    if: >-
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.changes.outputs.docker == 'true' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR — GITHUB_TOKEN yeterli (ek secret yok). İlk push'ta paket repo
      # görünürlüğünü miras alır; org kısıtlaması varsa tek seferlik onay gerekir.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # main -> :latest, develop -> :edge; her ikisi de :sha-<short> taşır.
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,prefix=sha-

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # dependency:go-offline katmanı cache'lenir (GHA cache backend).
          cache-from: type=gha
          cache-to: type=gha,mode=max
